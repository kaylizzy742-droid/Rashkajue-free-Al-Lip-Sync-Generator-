<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rashkajue - Free AI Lip Sync Generator Online</title>
    <style>
        :root {
            --primary-color: #0077ff;
            --secondary-color: #00e1ff;
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-muted);
        }

        .generator-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .file-input-wrapper {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .file-input-wrapper:hover {
            border-color: var(--primary-color);
        }

        input[type="file"] {
            display: none;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 1rem;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <!-- Your uploaded photo embedded as the logo -->
            <img src="fbfcd7cb-bf7b-44ff-9ad9-1cd6bd24b268-1_all_6678.png" alt="Rashkajue Logo" class="logo-img">
            <span class="brand-name">Rashkajue AI</span>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>Free AI Lip Sync Generator Online</h1>
            <p>Generate realistic AI lip-sync videos in minutes with options from 1 to 10 minutes.</p>
        </section>

        <section class="generator-card">
            <form id="lipsync-form">
                <!-- Image/Video Source Upload -->
                <div class="form-group">
                    <label>1. Upload Avatar Image / Video</label>
                    <div class="file-input-wrapper" onclick="document.getElementById('avatar-input').click()">
                        <p id="avatar-label">Click or drag & drop image/video file here</p>
                        <input type="file" id="avatar-input" accept="image/*,video/*" required onchange="updateFileName(this, 'avatar-label')">
                    </div>
                </div>

                <!-- Audio Upload -->
                <div class="form-group">
                    <label>2. Upload Speech / Audio File</label>
                    <div class="file-input-wrapper" onclick="document.getElementById('audio-input').click()">
                        <p id="audio-label">Click or drag & drop audio file (.mp3, .wav)</p>
                        <input type="file" id="audio-input" accept="audio/*" required onchange="updateFileName(this, 'audio-label')">
                    </div>
                </div>

                <!-- Duration Selection (1 to 10 minutes) -->
                <div class="form-group">
                    <label for="duration">3. Select Target Video Duration</label>
                    <select id="duration" name="duration" required>
                        <option value="1">1 Minute</option>
                        <option value="2">2 Minutes</option>
                        <option value="3">3 Minutes</option>
                        <option value="4">4 Minutes</option>
                        <option value="5">5 Minutes</option>
                        <option value="6">6 Minutes</option>
                        <option value="7">7 Minutes</option>
                        <option value="8">8 Minutes</option>
                        <option value="9">9 Minutes</option>
                        <option value="10">10 Minutes</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Generate AI Lip Sync</button>
            </form>
        </section>
    </main>

    <footer>
        &copy; 2026 Rashkajue AI Lip Sync Generator Online. All rights reserved.
    </footer>

    <script>
        function updateFileName(input, labelId) {
            const label = document.getElementById(labelId);
            if (input.files && input.files[0]) {
                label.textContent = "Selected: " + input.files[0].name;
            }
        }

        document.getElementById('lipsync-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const duration = document.getElementById('duration').value;
            alert('Processing your AI Lip Sync request for ' + duration + ' minute(s). To enable real AI video generation, connect this form to a backend service or API.');
        });
    </script>
</body>
</html>
